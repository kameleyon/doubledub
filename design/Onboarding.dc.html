<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121214; font-family: Manrope, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F8D117; text-decoration: none; }
    a:hover { color: #FFE45C; }
    .dd-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .dd-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; padding: 0; color: inherit; text-align: left; }
    input { font-family: inherit; }
    input::placeholder { color: #55555C; }
    input:focus { outline: none; border-color: #F8D117; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #121214; color: #EDEDEC; display: flex; flex-direction: column; overflow: hidden;">

  <div class="dd-scroll" style="flex-grow: 1; overflow-y: auto; padding: 52px 26px 26px 26px; display: flex; flex-direction: column;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; flex-shrink: 0;">
      <span style="{{markStyle}}">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#121214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.6 9.6 17.7 19.5 6.9"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
        <span style="{{wordmarkStyle}}">doubledub</span>
        <span style="font-size: 9.5px; font-weight: 500; letter-spacing: 0.34em; color: #6E6E75; padding-left: 0.34em;">BETTER PICKS &nbsp;BIGGER WINS</span>
      </div>
    </div>

    <div style="display: flex; gap: 4px; margin-top: 34px; padding: 4px; background: #1A1A1D; border: 1px solid #26262B; border-radius: 14px; flex-shrink: 0;">
      <button onClick="{{pickSignup}}" style="{{signupTabStyle}}">Create account</button>
      <button onClick="{{pickLogin}}" style="{{loginTabStyle}}">Log in</button>
    </div>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 11.5px; font-weight: 500; letter-spacing: 0.02em; color: #8C8C93;">Email address</label>
        <input type="email" placeholder="you@example.com" style="width: 100%; height: 54px; padding: 0 15px; background: #1A1A1D; border: 1.5px solid #2A2A2E; border-radius: 13px; color: #EDEDEC; font-size: 14.5px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <label style="font-size: 11.5px; font-weight: 500; letter-spacing: 0.02em; color: #8C8C93;">{{passwordLabel}}</label>
          <button onClick="{{toggleReveal}}" style="height: 22px; font-size: 11.5px; font-weight: 500; color: #6E6E75;">{{revealLabel}}</button>
        </div>
        <input type="{{passwordType}}" placeholder="{{passwordPlaceholder}}" style="width: 100%; height: 54px; padding: 0 15px; background: #1A1A1D; border: 1.5px solid #2A2A2E; border-radius: 13px; color: #EDEDEC; font-size: 14.5px;">
      </div>

      <sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; justify-content: flex-end; margin-top: -4px;">
          <button style="height: 40px; font-size: 12.5px; font-weight: 500; color: #8C8C93;">Forgot password?</button>
        </div>
      </sc-if>

      <sc-if value="{{isSignup}}" hint-placeholder-val="{{true}}">
        <button onClick="{{toggleAge}}" style="display: flex; align-items: flex-start; gap: 12px; min-height: 48px; padding: 4px 0;">
          <span style="{{checkboxStyle}}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#17170C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="{{checkIconStyle}}"><path d="M4.5 12.6 9.6 17.7 19.5 6.9"></path></svg>
          </span>
          <span style="font-size: 12.5px; line-height: 1.5; color: #9C9CA3; text-wrap: pretty;">I am 21 or older and I accept the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
        </button>
      </sc-if>

    </div>

    <button style="{{ctaStyle}}">{{ctaLabel}}</button>

    <div style="display: flex; align-items: center; gap: 14px; margin-top: 24px; flex-shrink: 0;">
      <span style="flex-grow: 1; height: 1px; background: #26262B;"></span>
      <span style="font-size: 11px; color: #55555C; letter-spacing: 0.06em;">OR</span>
      <span style="flex-grow: 1; height: 1px; background: #26262B;"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px; flex-shrink: 0;">
      <button style="display: flex; align-items: center; justify-content: center; gap: 11px; width: 100%; height: 54px; background: #1A1A1D; border: 1.5px solid #2A2A2E; border-radius: 13px; font-size: 14px; font-weight: 500; color: #EDEDEC;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.9-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7 1.4 0 1.8.7 3 .7 1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.5ZM14.2 5.6c.6-.8 1-1.9.9-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.9 1 0 2.1-.5 2.7-1.3Z"></path></svg>
        Continue with Apple
      </button>
      <button style="display: flex; align-items: center; justify-content: center; gap: 11px; width: 100%; height: 54px; background: #1A1A1D; border: 1.5px solid #2A2A2E; border-radius: 13px; font-size: 14px; font-weight: 500; color: #EDEDEC;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z"></path><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"></path><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z"></path><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1Z"></path></svg>
        Continue with Google
      </button>
    </div>

    <p style="margin: 26px 0 0 0; font-size: 10.5px; line-height: 1.6; color: #4E4E55; text-align: center; text-wrap: pretty;">doubledub publishes information and opinion only and does not accept wagers. 21+ only. If you or someone you know has a gambling problem, call 1-800-GAMBLER.</p>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F8D117","options":["#F8D117","#EDEDEC","#3FBF7F","#7C6BF5"],"section":"Brand"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { mode: 'signup', reveal: false, age: false };

  accent() { return this.props.accent || '#F8D117'; }

  tabStyle(on) {
    var base = 'flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 11px; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em;';
    if (on) return base + ' background: ' + this.accent() + '; color: #17170C;';
    return base + ' background: transparent; color: #8C8C93;';
  }

  renderVals() {
    var self = this;
    var S = this.state;
    var accent = this.accent();
    var isSignup = S.mode === 'signup';
    var ready = !isSignup || S.age;

    return {
      accent: accent,
      markStyle: 'width: 62px; height: 62px; border-radius: 19px; background: ' + accent + '; display: flex; align-items: center; justify-content: center;',
      wordmarkStyle: 'font-size: 30px; font-weight: 700; letter-spacing: -0.055em; color: ' + accent + '; line-height: 1;',

      isSignup: isSignup,
      isLogin: !isSignup,
      signupTabStyle: this.tabStyle(isSignup),
      loginTabStyle: this.tabStyle(!isSignup),
      pickSignup: function () { self.setState({ mode: 'signup' }); },
      pickLogin: function () { self.setState({ mode: 'login' }); },

      passwordLabel: isSignup ? 'Create a password' : 'Password',
      passwordPlaceholder: isSignup ? 'At least 8 characters' : 'Enter your password',
      passwordType: S.reveal ? 'text' : 'password',
      revealLabel: S.reveal ? 'Hide' : 'Show',
      toggleReveal: function () { self.setState({ reveal: !S.reveal }); },

      toggleAge: function () { self.setState({ age: !S.age }); },
      checkboxStyle: 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px; margin-top: 1px; display: flex; align-items: center; justify-content: center; '
        + (S.age ? 'background: ' + accent + '; border: 1.5px solid ' + accent + ';' : 'background: #1A1A1D; border: 1.5px solid #3D3D45;'),
      checkIconStyle: S.age ? '' : 'display: none;',

      ctaLabel: isSignup ? 'Create account' : 'Log in',
      ctaStyle: 'display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; margin-top: 24px; flex-shrink: 0; border-radius: 14px; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; '
        + (ready
          ? 'background: ' + accent + '; color: #17170C;'
          : 'background: #232328; color: #55555C;')
    };
  }
}
</script>
</body>
</html>
